name: Scheduled Web Scraping Agent

on:
  schedule:
    - cron: '17 8-19/2 * * *' # Start at hour 8:17 UTC, run every 2 hours up through hour 19:17 UTC during event days
  workflow_dispatch:

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Execute Agent Script with uv
        env:
          GEMINI_API_KEY: ${{ secrets.MY_GEMINI_API_KEY }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: uv run scraper.py