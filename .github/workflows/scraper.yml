name: Web Scraper Monitor

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every X hours
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Cache for Baseline File
        uses: actions/cache@v4
        with:
          path: last_content.txt
          key: scraper-last-content-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scraper-last-content-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          pip install httpx beautifulsoup4

      - name: Run Web Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py
